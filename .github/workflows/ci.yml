name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Inspect flight-view Prettier formatting (temporary)
        run: |
          npx prettier src/flight/FlightWorkspace.tsx > /tmp/flight-formatted.tsx
          diff -u src/flight/FlightWorkspace.tsx /tmp/flight-formatted.tsx || true
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lunar_margin
          POSTGRES_PASSWORD: lunar_margin
          POSTGRES_DB: lunar_margin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lunar_margin -d lunar_margin_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RESERVATION_TEST_DATABASE_URL: postgresql://lunar_margin:lunar_margin@localhost:5432/lunar_margin_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
