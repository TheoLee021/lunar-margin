name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Preview formatted grid files
        run: |
          npx prettier --write src/api/landingGrid.ts src/mission/MissionWorkspace.tsx src/search/CandidateDetail.tsx src/search/LandingGridPanel.tsx
          for p in src/api/landingGrid.ts src/mission/MissionWorkspace.tsx src/search/CandidateDetail.tsx src/search/LandingGridPanel.tsx; do
            echo "@@PRETTIER_BEGIN:$p"
            base64 -w0 "$p"
            echo
            echo "@@PRETTIER_END:$p"
          done
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
